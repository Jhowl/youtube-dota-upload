<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS YouTube Uploader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-orbit"></div>
    <main class="app">
      <header class="header">
        <div>
          <div class="eyebrow">Local Queue</div>
          <h1>OBS YouTube Uploader</h1>
          <p>Review new recordings, edit metadata, and upload manually.</p>
        </div>
        <div class="stats" id="stats"></div>
      </header>

      <section class="toolbar">
        <div class="hint">Watching your folder in real time.</div>
        <button class="btn ghost" id="refresh">Refresh</button>
      </section>

      <section class="list" id="videos"></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
