# Nginx reverse proxy for the Dota Uploader dashboard
#
# Save as: /etc/nginx/sites-available/dota-uploader
# Enable:  sudo ln -s /etc/nginx/sites-available/dota-uploader /etc/nginx/sites-enabled/dota-uploader
# Then:    sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name dota-uploader.home;

  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
