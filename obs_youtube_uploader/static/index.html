<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dota Uploader Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-orbit"></div>
    <main class="app shell">
      <section class="hero panel">
        <div>
          <div class="eyebrow">Dota Workflow</div>
          <h1>Dota Uploader Dashboard</h1>
          <p>Review your queue faster, manage uploads, and connect YouTube from the site.</p>
        </div>
        <div class="hero-actions">
          <button class="btn ghost" id="refresh">Refresh</button>
        </div>
      </section>

      <section class="grid-top">
        <div class="panel youtube-panel" id="youtube-panel"></div>
        <div class="panel stats-panel">
          <div class="section-title">Queue Overview</div>
          <div class="stats" id="stats"></div>
        </div>
      </section>

      <section class="panel filters-panel">
        <div class="filters-row">
          <div class="search-wrap">
            <input id="search" type="search" placeholder="Search title, filename, match id…" />
          </div>
          <div class="pill-row" id="status-filters"></div>
        </div>
        <div class="hint" id="flash"></div>
      </section>

      <section class="workspace">
        <div class="panel table-panel">
          <div class="section-title">Video Queue</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Status</th>
                  <th>Seq</th>
                  <th>Filename</th>
                  <th>Title</th>
                  <th>Match</th>
                  <th>Updated</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="videos"></tbody>
            </table>
          </div>
        </div>

        <aside class="panel detail-panel" id="detail-panel">
          <div class="empty-state">Select a video to review and edit.</div>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
